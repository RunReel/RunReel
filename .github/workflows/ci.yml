name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.10 and 3.11 use the sys.settrace golden traces, 3.12+ the inlined-comprehension ones.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      UV_LOCKED: "1" # fail if uv.lock is out of date instead of rewriting it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python }}
          enable-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: player/package-lock.json

      - name: Install
        run: make setup

      - name: Build the player
        run: make build

      - name: Lint, type-check and test
        run: make check

  # One stable name for the main branch's required status check, whatever the matrix holds.
  check:
    name: check
    if: always()
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every Python version passed
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
