name: Release

# Publishing a GitHub release tagged vX.Y.Z (matching the version in pyproject.toml)
# builds the package, checks it, and uploads it to PyPI.
on:
  release:
    types: [published]

permissions: {}

# One release at a time, and never cancel an upload halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_LOCKED: "1" # fail if uv.lock is out of date instead of rewriting it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No caches: a release starts clean, so nothing saved by an earlier run can get into it.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: "3.13"
          enable-cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check the tag matches the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv version --short)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::the release tag is $TAG but pyproject.toml says $version"
            exit 1
          fi

      - name: Install
        run: make setup

      # The wheel only contains the player if it was built first.
      - name: Build the player
        run: make build

      - name: Lint, type-check and test
        run: make check

      - name: Build the package
        run: uv build

      - name: Check the package contains the player and makes a reel
        run: |
          python3 -m zipfile -l dist/*.whl | grep -q 'runreel/_player/player.js'
          tar -tzf dist/*.tar.gz | grep -q 'src/runreel/_player/player.js'
          uv tool run --isolated --from dist/*.whl runreel run examples/dijkstra.py \
            --call "dijkstra(G, 0)" --out "$RUNNER_TEMP/dijkstra.reel.html"
          grep -q 'RunReelPlayer.mount(' "$RUNNER_TEMP/dijkstra.reel.html"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/runreel/
    permissions:
      id-token: write # trusted publishing: PyPI trades this token for a short-lived upload token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: false

      - name: Upload to PyPI
        run: uv publish --trusted-publishing always dist/*
