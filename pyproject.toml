[project]
name = "runreel"
version = "0.0.0"
description = "See what your AI actually wrote: turn any algorithm into an interactive step-through reel."
authors = [{ name = "dsyz2007" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["algorithms", "data-structures", "visualization", "education", "tracing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/RunReel/RunReel"

[project.scripts]
runreel = "runreel.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
